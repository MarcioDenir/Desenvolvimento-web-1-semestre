<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
</head>
<body>
    <form method="post "action="" onsubmit="alert('Cadastro realizado com Sucesso!')">
        <p>Crie um cadastro para acessar a loja seguindo os passos abaixo.</p>

        <label>Insira seu nome</label><br>
        <input type="text" name="nome" placeholder="Insira seu nome completo!"required> <br><br>

        <label>Informe seu email</label><br>
        <input type="email" name="email" placeholder="Informe seu email" required><br><br>


        <label>Informe sua senha</label><br>
        <input type="password" name="pwd" placeholder="Informe sua senha"required><br><br>

        <label>Informe sua data de nascimento</label><br>
        <input type="date" name="nascimento">  <br><br>

        <label>Infome seu sexo</label><br>
    
        <input type="radio" 
        id="Feminino"
        name="sexo"
        value="Feminino">
        <label for="Feminino">Feminino</label><br>
        <input type="radio"
        id="Masculino"
        name="sexo"
        value="Masculino">
        <label for="Masculino">Masculino</label><br>
        <input type="radio"
        id="Não definido"
        name="sexo"
        value="Não defenido">
        <label for="Não defenido">Não definido</label><br>
        <br><br>

        <label>Selecione sua cor preferida</label><br>
        <input type="color" name="cor"><br>
        <br>

        <label>Comentario ou observação sobre o cadastro:</label><br>
        <input type="text" name="comentario" placeholder="comentário">
        <br><br>

        <label>Anexe uma foto</label><br>
        <input type="file" name="imagen"><br>
        <br><br>
        <input type="submit">

    </form>
</body>
</html>
